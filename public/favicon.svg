<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="clockGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22C55E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Clock face -->
  <circle cx="50" cy="50" r="45" fill="url(#clockGradient)" />
  <circle cx="50" cy="50" r="40" fill="#0F172A" />
  <!-- Hour markers -->
  <circle cx="50" cy="15" r="3" fill="#22C55E" />
  <circle cx="85" cy="50" r="3" fill="#22C55E" />
  <circle cx="50" cy="85" r="3" fill="#22C55E" />
  <circle cx="15" cy="50" r="3" fill="#22C55E" />
  <!-- Hour hand -->
  <line x1="50" y1="50" x2="50" y2="28" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round" />
  <!-- Minute hand -->
  <line x1="50" y1="50" x2="70" y2="50" stroke="#22C55E" stroke-width="3" stroke-linecap="round" />
  <!-- Center dot -->
  <circle cx="50" cy="50" r="4" fill="#06B6D4" />
</svg>
